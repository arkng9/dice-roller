<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dice Roller</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  
  <div class="container">
    <h1>Dice Roller</h1>
    <p class="subtitle">Kaç zar atmak istediğini seç ve şansını dene.</p>

    <div class="buttons">
  <button class="dice-btn active" onclick="setDice(1, this)">1 Zar</button>
  <button class="dice-btn" onclick="setDice(2, this)">2 Zar</button>
  <button class="dice-btn" onclick="setDice(3, this)">3 Zar</button>
</div>

<button id="soundToggle">🔊 Ses Açık</button>

<button class="roll-btn" id="rollButton" onclick="rollDice()">Zar At</button>


    <p id="statusText" class="status-text"></p>

    <div id="diceContainer" class="dice-container"></div>

    <div id="totalBox" class="total-box hidden">
      Toplam: <span id="totalValue">0</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
